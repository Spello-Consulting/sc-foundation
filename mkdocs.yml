site_name: Spello Consulting Foundation Library
site_url: https://github.com/Spello-Consulting//sc-foundation

theme:
  name: material
  features:
    - navigation.expand

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google  # or numpy, sphinx
            show_source: false
            heading_level: 2

nav:
  - Home: index.md
  - API Reference:
      - Common Utilities: reference/common.md
      - SCConfigManager: reference/configmanager.md
      - SCLogger: reference/logging.md

      - CSVReader: reference/csvreader.md
      - DateHelper: reference/datehelper.md
      - JSONEncoder: reference/jsonencoder.md
      - ThreadManager: reference/thread_manager.md
