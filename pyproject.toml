[project]
name = "sc-foundation-services"
version = "3.5.0"
description = "Spello Consulting foundation package. A Python library for log file management; config file management; CSV and JSON file operations and more."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astral>=3.2",
    "cerberus>=1.3.8",
    "httpx>=0.28.1",
    "mergedeep>=1.3.4",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.1.post1",
    "pyyaml>=6.0.3",
    "tzfpy>=1.2.0",
    "tzdata>=2026.1",
    "validators>=0.35.0",
    "requests>=2.33.1",
    "twilio>=9.10.9",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-mock>=3.15.1",
    "pre-commit>=3.5.0",
    "pytest-dotenv>=0.5.2",
]
docs = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-include-markdown-plugin>=6.2.2",
    "mkdocs-material>=9.6.14",
    "mkdocstrings>=0.26.1",
    "mkdocstrings-python>=1.11.1",
    "pdoc>=14.7.0",
]
all = [
    "sc-foundation-services[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/Spello-Consulting/"
Repository = "https://github.com/Spello-Consulting/sc-foundation"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

